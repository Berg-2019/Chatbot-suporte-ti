# =============================================================================
# Helpdesk MSM - Produção
# Sistema de Atendimento Técnico (TI + Elétrica + Compras)
# =============================================================================

services:
  # ============================================================================
  # Banco de Dados Principal
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: helpdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Cache e Sessões
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: helpdesk_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Fila de Mensagens
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: helpdesk_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-helpdesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-helpdesk123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Backend NestJS
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://helpdesk:${POSTGRES_PASSWORD:-helpdesk123}@postgres:5432/helpdesk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-helpdesk}:${RABBITMQ_PASSWORD:-helpdesk123}@rabbitmq:5672
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 1 domínio único (sector vem do JWT, não do host). Proxy reverso externo
      # finaliza SSL e reescreve Host; aqui no compose interno é localhost.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost,http://localhost:80,http://localhost:5173,http://nginx}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:dev@helpdeskmsm.com.br}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - helpdesk_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # Hermes Agent - Bot WhatsApp (Baileys + IA)
  # ============================================================================
  hermes:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    container_name: helpdesk_hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    entrypoint: ["/opt/hermes/.venv/bin/hermes"]
    environment:
      NODE_ENV: production
      HERMES_HOME: /opt/data
      HERMES_WEB_DIST: /opt/hermes/hermes_cli/web_dist
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HERMES_BACKEND_URL: http://hermes-tools:3003
      HERMES_API_KEY: ${HERMES_API_KEY}
      WHATSAPP_ENABLED: "true"
      WHATSAPP_MODE: bot
      WHATSAPP_ALLOWED_USERS: "*"
      WHATSAPP_BRIDGE_PORT: "3001"
      GATEWAY_ALLOW_ALL_USERS: "true"
      HERMES_MODEL_PROVIDER: openai-compatible
      HERMES_MODEL_BASE_URL: ${HERMES_MODEL_BASE_URL:-https://api.minimax.io/v1}
      HERMES_MODEL_NAME: ${HERMES_MODEL_NAME:-MiniMax-M2}
    volumes:
      - hermes_data:/opt/data
      - hermes_whatsapp_session:/root/.hermes/platforms/whatsapp/session
    networks:
      - helpdesk_network
    depends_on:
      - hermes-tools

  # ============================================================================
  # Hermes Tools Server - Bridge entre Hermes Agent e Backend
  # ============================================================================
  hermes-tools:
    build:
      context: ./hermes-integration/backend-tools
      dockerfile: Dockerfile
    container_name: helpdesk_hermes_tools
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3000
      BACKEND_ORIGIN: http://backend:3000
      WHATSAPP_BRIDGE_URL: http://hermes-tools:3001
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-helpdesk}:${RABBITMQ_PASSWORD:-helpdesk123}@rabbitmq:5672
      HERMES_API_KEY: ${HERMES_API_KEY}
      TOOLS_PORT: 3003
      MEDIA_TEMP_DIR: /app/media
    volumes:
      - backend_uploads:/app/uploads:ro
      - media_temp:/app/media
    networks:
      - helpdesk_network
    depends_on:
      - backend
    command: >
      sh -c "node proxy.cjs &
              sleep 2 &&
              node server.js &
              sleep 3 &&
              node outgoing-consumer.js"

  # ============================================================================
  # Frontend Builder (Frontend-chatbot SPA)
  # Builda o dist/ e popula o volume `frontend_dist` consumido pelo nginx central.
  # ============================================================================
  frontend:
    build:
      context: ./Frontend-chatbot
      dockerfile: Dockerfile
      args:
        # API e WS pelo mesmo origin do SPA (path /api e /socket.io no nginx interno).
        # Quando o proxy reverso externo finalizar SSL, basta apontar pra http://nginx:80
        # — VITE_API_URL e VITE_WS_URL podem continuar relativos / mesmo origin.
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-/}
        # Senha do dev console (build-time). Em prod, setar via .env.
        VITE_DEV_PASSWORD: ${VITE_DEV_PASSWORD:-msm-dev-2026}
    container_name: helpdesk_frontend
    restart: unless-stopped
    volumes:
      - frontend_dist:/srv/html

  # ============================================================================
  # Nginx interno (single vhost HTTP; SSL/multi-host fica no proxy reverso externo)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: helpdesk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/sites-enabled:/etc/nginx/conf.d:ro
      - frontend_dist:/usr/share/nginx/html:ro
    networks:
      - helpdesk_network
    depends_on:
      - backend
      - frontend

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backend_logs:
  backend_uploads:
  hermes_data:
  hermes_whatsapp_session:
  media_temp:
  frontend_dist:

# ==============================================================================
# Networks
# ==============================================================================
networks:
  helpdesk_network:
    name: helpdesk_network
    external: true
