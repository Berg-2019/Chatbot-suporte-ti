# =============================================================================
# Helpdesk MSM - Produção
# Sistema de Atendimento Técnico (TI + Elétrica + Compras)
# =============================================================================

services:
  # ============================================================================
  # Banco de Dados Principal
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: helpdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helpdesk_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U helpdesk" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Cache e Sessões
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: helpdesk_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - helpdesk_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Fila de Mensagens
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: helpdesk_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-helpdesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-helpdesk123}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - helpdesk_network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Backend NestJS
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://helpdesk:${POSTGRES_PASSWORD:-helpdesk123}@postgres:5432/helpdesk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-helpdesk}:${RABBITMQ_PASSWORD:-helpdesk123}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-sua-chave-secreta-jwt}
      FRONTEND_URL: https://ti.helpdeskmsm.com.br,https://eletrica.helpdeskmsm.com.br,https://compras.helpdeskmsm.com.br
    volumes:
      - backend_logs:/app/logs
    networks:
      - helpdesk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ============================================================================
  # Frontend (profile-driven-app) - Único build, 3 subdomínios via nginx
  # ============================================================================
  # NOTA: O frontend é servido pelo container 'nginx' que faz proxy reverso
  # para o build SPA em /usr/share/nginx/html (montado do volume frontend_dist)
  # O build do frontend deve ser feito separadamente (repo profile-driven-app):
  #   cd ~/Projetos/profile-driven-app && bun run build
  # O volume 'frontend_dist' deve ser montado no container nginx

  # ============================================================================
  # Nginx Reverse Proxy (wildcard subdomínios)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: helpdesk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/sites-enabled:/etc/nginx/conf.d:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - frontend_manifests:/usr/share/nginx/html/manifests:ro
      - certbot_webroot:/var/www/certbot
    networks:
      - helpdesk_network
    depends_on:
      - backend

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
  mysql_data:
  redis_data:
  rabbitmq_data:
  backend_logs:
  frontend_dist:
    driver: local
  frontend_manifests:
    driver: local
  certbot_webroot:
    driver: local

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
  mysql_data:
  redis_data:
  rabbitmq_data:
  backend_logs:

# ==============================================================================
# Networks
# ==============================================================================
networks:
  helpdesk_network:
    name: helpdesk_network
    external: true
