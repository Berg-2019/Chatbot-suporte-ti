# ==============================================================================
# BACKEND API (api.helpdeskmsm.com.br)
# ==============================================================================
server {
    server_name api.helpdeskmsm.com.br;
    listen 443 ssl http2;
    listen 80;

    ssl_certificate     /etc/ssl/wildcard.helpdeskmsm.com.br.crt;
    ssl_certificate_key /etc/ssl/wildcard.helpdeskmsm.com.br.key;

    # Security headers for API
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Access-Control-Allow-Origin "https://ti.helpdeskmsm.com.br https://eletrica.helpdeskmsm.com.br https://compras.helpdeskmsm.com.br" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    # Handle preflight
    location = /OPTIONS {
        add_header Access-Control-Allow-Origin "https://ti.helpdeskmsm.com.br https://eletrica.helpdeskmsm.com.br https://compras.helpdeskmsm.com.br" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
        add_header Content-Length 0;
        add_header Content-Type "text/plain";
        return 204;
    }

    location / {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket support for Socket.IO
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400;
    }

    # Health check endpoint (no auth required)
    location = /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
    }
}
