# Helpdesk MSM - nginx interno (single vhost, HTTP only)
#
# Decisão 2026-05-12:
# - 1 domínio único (sector vem do JWT, não do host)
# - Proxy reverso/SSL fica FORA deste compose (Nginx Proxy Manager / Traefik /
#   Caddy / etc no servidor de produção). Este nginx é só roteador interno.
# - Acesso atual: http://localhost (porta 80 do host) ou http://nginx (dentro
#   da rede docker)
#
# Estrutura:
#   /          → SPA (TanStack Start build, servido de /usr/share/nginx/html)
#   /api/      → proxy_pass backend:3000 (NestJS)
#   /socket.io → proxy_pass backend:3000 (WebSocket upgrade)

server {
    listen 80 default_server;
    server_name _;

    # Headers básicos (proxy externo pode reescrever, sem problema)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ====================================================================
    # API — backend NestJS
    # ====================================================================
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket Socket.IO
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # Health (backend, sem auth)
    location = /health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
    }

    # ====================================================================
    # SPA — TanStack Start build
    # ====================================================================
    root /usr/share/nginx/html;
    index index.html;

    # PWA manifest (único)
    location = /manifest.webmanifest {
        try_files /manifest.webmanifest =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/manifest+json; charset=utf-8";
    }

    location /icons/ {
        alias /usr/share/nginx/html/icons/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache de assets fingerprintados
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
