# Helpdesk MSM - Multi-tenant Nginx Configuration
# 4 server blocks: ti.*, eletrica.*, compras.* (frontend SPA) + api.* (backend NestJS)
#
# SSL certificates: /etc/ssl/wildcard.helpdeskmsm.com.br.{crt,key}
# Managed by: Let's Encrypt via DNS-01 (renewal automated)
#
# Note: This config expects the frontend build in /usr/share/nginx/html (same for all 3 sectors)
# The Host header determines which sector/theme is served

# ==============================================================================
# FRONTEND - TI (ti.helpdeskmsm.com.br)
# ==============================================================================
server {
    server_name ti.helpdeskmsm.com.br;
    listen 443 ssl http2;
    listen 80;
    server_name ~^ti\..+$;  # catch-all for ti.* in dev/staging

    ssl_certificate     /etc/ssl/wildcard.helpdeskmsm.com.br.crt;
    ssl_certificate_key /etc/ssl/wildcard.helpdeskmsm.com.br.key;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Sector identification header (injected for frontend, no JWT dependency)
    add_header X-Frontend-Sector "TI" always;

    # PWA manifest (único — tema/sector decidido pelo JWT no client)
    location = /manifest.webmanifest {
        try_files /manifest.webmanifest =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/manifest+json; charset=utf-8";
    }

    # PWA icons - sector-specific
    location /icons/ {
        alias /usr/share/nginx/html/icons/ti/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

