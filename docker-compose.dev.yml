# =============================================================================
# Helpdesk WhatsApp + GLPI - Ambiente de DESENVOLVIMENTO
# Docker Compose com hot-reload para dev local
# =============================================================================

services:
  # ============================================================================
  # Banco de Dados Principal
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: helpdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Cache e Sessões
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: helpdesk_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Fila de Mensagens
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: helpdesk_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-helpdesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-helpdesk123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # MySQL - Banco de dados para GLPI
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: helpdesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: glpi
      MYSQL_USER: glpi
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-glpi123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # GLPI - Sistema de Tickets
  # ============================================================================
  glpi:
    image: diouxx/glpi:latest
    container_name: helpdesk_glpi
    restart: unless-stopped
    environment:
      TIMEZONE: America/Porto_Velho
    ports:
      - "8080:80"
    volumes:
      - glpi_data:/var/www/html/glpi
    networks:
      - helpdesk_network
    depends_on:
      mysql:
        condition: service_healthy

  # ============================================================================
  # Backend NestJS - DEV com Hot Reload
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: helpdesk_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://helpdesk:${POSTGRES_PASSWORD:-helpdesk123}@postgres:5432/helpdesk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-helpdesk}:${RABBITMQ_PASSWORD:-helpdesk123}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev-secret-jwt}
      GLPI_URL: http://glpi/apirest.php
      GLPI_APP_TOKEN: ${GLPI_APP_TOKEN:-dev-app-token}
      GLPI_USER_TOKEN: ${GLPI_USER_TOKEN:-dev-user-token}
      FRONTEND_URL: http://localhost:5173,http://192.168.7.118,http://192.168.7.118:5173,http://helpdeskmsm.com.br,https://helpdeskmsm.com.br,https://www.helpdeskmsm.com.br
      # Ollama Configuration
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
      - backend_logs:/app/logs
    networks:
      - helpdesk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ============================================================================
  # Frontend TI - Vite DEV (Hot Reload)
  # ============================================================================
  frontend-ti:
    build:
      context: ./support-mobile
      dockerfile: Dockerfile.dev
    container_name: helpdesk_frontend_ti_dev
    restart: unless-stopped
    ports:
      - "5173:8080"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
      VITE_SECTOR: TI
    volumes:
      - ./support-mobile:/app:delegated
      - /app/node_modules
    networks:
      - helpdesk_network
    depends_on:
      - backend

  # ============================================================================
  # Frontend Elétrica - Vite DEV (Hot Reload)
  # ============================================================================
  frontend-electric:
    build:
      context: ./suport-eletric
      dockerfile: Dockerfile.dev
    container_name: helpdesk_frontend_electric_dev
    restart: unless-stopped
    ports:
      - "5174:8080"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
      VITE_SECTOR: ELECTRIC
    volumes:
      - ./suport-eletric:/app:delegated
      - /app/node_modules
    networks:
      - helpdesk_network
    depends_on:
      - backend

  # ============================================================================
  # Frontend Compras - Vite DEV (Hot Reload)
  # ============================================================================
  frontend-compras:
    build:
      context: ./support-compras
      dockerfile: Dockerfile.dev
    container_name: helpdesk_frontend_compras_dev
    restart: unless-stopped
    ports:
      - "5175:8080"
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      VITE_WS_URL: ws://localhost:3000
      VITE_SECTOR: COMPRAS
    volumes:
      - ./support-compras:/app:delegated
      - /app/node_modules
    networks:
      - helpdesk_network
    depends_on:
      - backend

  # ============================================================================
  # Intent Classification Service - Python com spaCy/sklearn
  # ============================================================================
  intent-service:
    build:
      context: ./intent-service
      dockerfile: Dockerfile
    container_name: helpdesk_intent
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Hermes Agent - AI Agent como Bot WhatsApp
  # ============================================================================
  hermes:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    container_name: helpdesk_hermes
    restart: unless-stopped
    ports:
      - "3004:3000"  # Gateway API port
    environment:
      NODE_ENV: development
      HERMES_HOME: /opt/data
      HERMES_WEB_DIST: /opt/hermes/hermes_cli/web_dist
      # MiniMax AI Provider
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      # Backend integration
      HERMES_BACKEND_URL: http://hermes-tools:3003
      HERMES_API_KEY: ${HERMES_API_KEY:-hermes_dev_key_change_me}
      # WhatsApp Configuration
      WHATSAPP_ENABLED: "true"
      WHATSAPP_MODE: bot
      WHATSAPP_ALLOWED_USERS: "*"
      WHATSAPP_BRIDGE_PORT: "3001"
      # Model Configuration
      HERMES_MODEL_PROVIDER: openai-compatible
      HERMES_MODEL_BASE_URL: https://api.minimax.io/v1
      HERMES_MODEL_NAME: MiniMax-M2
    volumes:
      - hermes_data:/opt/data
      - hermes_skills:/root/.hermes/skills:ro
      - hermes_whatsapp_session:/root/.hermes/platforms/whatsapp/session
    networks:
      - helpdesk_network
    depends_on:
      - hermes-tools
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # Hermes Tools Server - Bridge entre Hermes Agent e Backend
  # ============================================================================
  hermes-tools:
    build:
      context: ./hermes-integration/backend-tools
      dockerfile: Dockerfile
    container_name: helpdesk_hermes_tools
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:3000
      HERMES_API_KEY: ${HERMES_API_KEY:-hermes_dev_key_change_me}
      TOOLS_PORT: 3003
    networks:
      - helpdesk_network
    depends_on:
      - backend

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: helpdesk_postgres_dev
  mysql_data:
    name: helpdesk_mysql_dev
  redis_data:
    name: helpdesk_redis_dev
  rabbitmq_data:
    name: helpdesk_rabbitmq_dev
  glpi_data:
    name: helpdesk_glpi_dev
  backend_node_modules:
    name: helpdesk_backend_node_modules_dev
  backend_logs:
    name: helpdesk_backend_logs_dev
  frontend_node_modules:
    name: helpdesk_frontend_node_modules_dev
  bot_node_modules:
    name: helpdesk_bot_node_modules_dev
  bot_sessions:
    name: helpdesk_bot_sessions_dev
  bot_logs:
    name: helpdesk_bot_logs_dev
  hermes_data:
    name: helpdesk_hermes_data
  hermes_skills:
    name: helpdesk_hermes_skills
  hermes_whatsapp_session:
    name: helpdesk_hermes_whatsapp_session

# ==============================================================================
# Networks
# ==============================================================================
networks:
  helpdesk_network:
    name: helpdesk_network
    external: true
