# =============================================================================
# Helpdesk MSM - Ambiente de DESENVOLVIMENTO
# Docker Compose com hot-reload para dev local
# =============================================================================

services:
  # ============================================================================
  # Banco de Dados Principal
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: helpdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Cache e Sessões
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: helpdesk_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Fila de Mensagens
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: helpdesk_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-helpdesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-helpdesk123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Backend NestJS - DEV com Hot Reload
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: helpdesk_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://helpdesk:${POSTGRES_PASSWORD:-helpdesk123}@postgres:5432/helpdesk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-helpdesk}:${RABBITMQ_PASSWORD:-helpdesk123}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev-secret-jwt}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-internal_dev_key_change_me}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@helpdeskmsm.com.br}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
      - backend_logs:/app/logs
      - whatsapp_sessions:/app/sessions
    networks:
      - helpdesk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ============================================================================
  # Frontend - Frontend-chatbot (Único build, 3 subdomínios via nginx)
  # ============================================================================
  # NOTA: Em dev local, rode o frontend separadamente com bun:
  #   cd ./Frontend-chatbot
  #   bun run dev:ti       # → http://localhost:5173 (TI)
  #   bun run dev:electric  # → http://localhost:5174 (Elétrica)
  #   bun run dev:compras   # → http://localhost:5175 (Compras)
  #
  # Para smoke test completo com nginx, use docker-compose.staging.yml

  # ============================================================================
  # Intent Classification Service — REMOVIDO
  # Classificação de intenção agora é feita pelo IntentService dentro do NestJS
  # via MiniMax API (sem container Python separado)
  # ============================================================================

  # ============================================================================
  # Hermes Agent + Tools — REMOVIDOS (substituídos por WhatsAppModule nativo)
  # Bot WhatsApp agora roda dentro do backend NestJS via BaileysService
  # Veja: backend/src/infrastructure/whatsapp/
  # ============================================================================

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: helpdesk_postgres_dev
  redis_data:
    name: helpdesk_redis_dev
  rabbitmq_data:
    name: helpdesk_rabbitmq_dev
  backend_node_modules:
    name: helpdesk_backend_node_modules_dev
  backend_logs:
    name: helpdesk_backend_logs_dev
  whatsapp_sessions:
    name: helpdesk_whatsapp_sessions

# ==============================================================================
# Networks
# ==============================================================================
networks:
  helpdesk_network:
    name: helpdesk_network
    external: true
