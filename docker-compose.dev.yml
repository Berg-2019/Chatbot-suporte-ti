# =============================================================================
# Helpdesk MSM - Ambiente de DESENVOLVIMENTO
# Docker Compose com hot-reload para dev local
# =============================================================================

services:
  # ============================================================================
  # Banco de Dados Principal
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: helpdesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Cache e Sessões
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: helpdesk_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Fila de Mensagens
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: helpdesk_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-helpdesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-helpdesk123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Backend NestJS - DEV com Hot Reload
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: helpdesk_backend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://helpdesk:${POSTGRES_PASSWORD:-helpdesk123}@postgres:5432/helpdesk
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-helpdesk}:${RABBITMQ_PASSWORD:-helpdesk123}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-dev-secret-jwt}
      HERMES_API_KEY: ${HERMES_API_KEY:-hermes_dev_key_change_me}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      FRONTEND_URL: http://localhost:5173,http://192.168.7.118,http://192.168.7.118:5173,http://helpdeskmsm.com.br,https://helpdeskmsm.com.br,https://www.helpdeskmsm.com.br
    volumes:
      - ./backend:/app:delegated
      - /app/node_modules
      - backend_logs:/app/logs
    networks:
      - helpdesk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # ============================================================================
  # Frontend - profile-driven-app (Único build, 3 subdomínios via nginx)
  # ============================================================================
  # NOTA: Em dev local, rode o frontend separadamente com bun:
  #   cd ~/Projetos/profile-driven-app
  #   bun run dev:ti       # → http://localhost:5173 (TI)
  #   bun run dev:electric  # → http://localhost:5174 (Elétrica)
  #   bun run dev:compras   # → http://localhost:5175 (Compras)
  #
  # Para smoke test completo com nginx, use docker-compose.staging.yml

  # ============================================================================
  # Intent Classification Service - Python com spaCy/sklearn
  # ============================================================================
  intent-service:
    build:
      context: ./intent-service
      dockerfile: Dockerfile
    container_name: helpdesk_intent
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    networks:
      - helpdesk_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # Hermes Agent - AI Agent como Bot WhatsApp
  # ============================================================================
  hermes:
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    container_name: helpdesk_hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    entrypoint: ["/opt/hermes/.venv/bin/hermes"]
    ports:
      - "3004:3000"  # Gateway API port
    environment:
      NODE_ENV: development
      HERMES_HOME: /opt/data
      HERMES_WEB_DIST: /opt/hermes/hermes_cli/web_dist
      # MiniMax AI Provider
      MINIMAX_API_KEY: ${MINIMAX_API_KEY}
      # Backend integration
      HERMES_BACKEND_URL: http://hermes-tools:3003
      HERMES_API_KEY: ${HERMES_API_KEY:-hermes_dev_key_change_me}
      # WhatsApp Configuration
      WHATSAPP_ENABLED: "true"
      WHATSAPP_MODE: bot
      WHATSAPP_ALLOWED_USERS: "*"
      WHATSAPP_BRIDGE_PORT: "3001"
      GATEWAY_ALLOW_ALL_USERS: "true"
      # Model Configuration
      HERMES_MODEL_PROVIDER: openai-compatible
      HERMES_MODEL_BASE_URL: https://api.minimax.io/v1
      HERMES_MODEL_NAME: MiniMax-M2
    volumes:
      - hermes_data:/opt/data
      - hermes_skills:/root/.hermes/skills:ro
      - hermes_whatsapp_session:/root/.hermes/platforms/whatsapp/session
    networks:
      - helpdesk_network
    depends_on:
      - hermes-tools
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================================
  # Hermes Tools Server - Bridge entre Hermes Agent e Backend
  # ============================================================================
  hermes-tools:
    build:
      context: ./hermes-integration/backend-tools
      dockerfile: Dockerfile
    container_name: helpdesk_hermes_tools
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:3000
      BACKEND_ORIGIN: http://backend:3000
      WHATSAPP_BRIDGE_URL: http://hermes-tools:3001
      RABBITMQ_URL: amqp://helpdesk:${RABBITMQ_PASSWORD:-37b87676ed3d28ca08e2d5f2e95cfc79}@rabbitmq:5672
      HERMES_API_KEY: ${HERMES_API_KEY:-hermes_dev_key_change_me}
      TOOLS_PORT: 3003
      MEDIA_TEMP_DIR: /app/media
    volumes:
      - ./backend/uploads:/app/uploads:ro
      - media_temp:/app/media
    networks:
      - helpdesk_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    command: >
      sh -c "node proxy.cjs &
              sleep 2 &&
              node server.js &
              sleep 3 &&
              node outgoing-consumer.js"

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    name: helpdesk_postgres_dev
  redis_data:
    name: helpdesk_redis_dev
  rabbitmq_data:
    name: helpdesk_rabbitmq_dev
  backend_node_modules:
    name: helpdesk_backend_node_modules_dev
  backend_logs:
    name: helpdesk_backend_logs_dev
  hermes_data:
    name: helpdesk_hermes_data
  hermes_skills:
    name: helpdesk_hermes_skills
  hermes_whatsapp_session:
    name: helpdesk_hermes_whatsapp_session
  media_temp:
    name: helpdesk_media_temp

# ==============================================================================
# Networks
# ==============================================================================
networks:
  helpdesk_network:
    name: helpdesk_network
    external: true
